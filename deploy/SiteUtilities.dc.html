<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>body { margin: 0; }</style>
</helmet>
<div style="fontFamily: 'Figtree', system-ui, sans-serif;">
  <div style="position: fixed; right: clamp(14px, 3vw, 28px); bottom: clamp(14px, 3vw, 28px); zIndex: 100; display: flex; flexDirection: column; alignItems: flex-end; gap: 12px;">

    <div role="dialog" aria-label="Ahlan-Trips quick answers" style="display: {{ panelDisplay }}; width: min(360px, calc(100vw - 32px)); background: #ffffff; border: 1px solid #ECE7E0; borderRadius: 18px; boxShadow: 0 30px 70px rgba(17,17,17,.2); overflow: hidden;">
      <div style="padding: 18px 20px; background: #111111; color: #fff;">
        <div style="fontSize: 15px; fontWeight: 700;">Ask Ahlan-Trips</div>
        <div style="fontSize: 12.5px; color: #ABA49C; marginTop: 2px;">Quick answers about our services.</div>
      </div>
      <div style="padding: 14px; display: flex; flexWrap: wrap; gap: 7px;">
        <sc-for list="{{ questions }}" as="q" hint-placeholder-count="5">
          <button type="button" onClick="{{ q.pick }}" style="background: {{ q.bg }}; color: {{ q.color }}; border: 1px solid {{ q.border }}; borderRadius: 999px; padding: 8px 13px; fontFamily: inherit; fontSize: 12.5px; fontWeight: 600; cursor: pointer; transition: background .16s;">{{ q.label }}</button>
        </sc-for>
      </div>
      <div style="padding: 0 18px 20px;">
        <p aria-live="polite" style="margin: 0; fontSize: 13.5px; lineHeight: 1.62; color: #4A443F; background: #FBF8F4; border: 1px solid #F0EAE2; borderRadius: 12px; padding: 14px 15px; textWrap: pretty;">{{ answer }}</p>
        <a href="/contact" style="display: block; textAlign: center; marginTop: 12px; fontSize: 13.5px; fontWeight: 600; color: #B84D00; textDecoration: none;">Full enquiry form →</a>
      </div>
    </div>

    <div style="display: flex; alignItems: center; gap: 10px;">
      <button type="button" aria-expanded="{{ open }}" onClick="{{ toggle }}" style="display: inline-flex; alignItems: center; gap: 8px; height: 48px; padding: 0 20px; background: #111111; color: #fff; border: none; borderRadius: 999px; fontFamily: inherit; fontSize: 13.5px; fontWeight: 600; cursor: pointer; boxShadow: 0 10px 28px rgba(17,17,17,.26); transition: transform .18s;" style-hover="transform: translateY(-2px);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        {{ toggleLabel }}
      </button>
      <a href="https://wa.me/21627764593?text=Hello%20Ahlan-Trips%2C%20I%27d%20like%20to%20know%20more%20about%20your%20corporate%20travel%20services." target="_blank" rel="noopener" aria-label="Chat with Ahlan-Trips on WhatsApp" style="width: 56px; height: 56px; display: grid; placeItems: center; background: #25D366; borderRadius: 999px; boxShadow: 0 10px 28px rgba(37,211,102,.4); transition: transform .18s;" style-hover="transform: translateY(-2px) scale(1.04);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"></path></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:520}}">
class Component extends DCLogic {
  state = { open: false, key: "intro" };

  renderVals() {
    const qa = {
      intro: ["", "Hi — choose a question for a quick answer. For detailed enquiries, use our contact form."],
      services: ["Services", "Corporate travel management, travel management and policy, meetings & events (MICE), visa assistance, leisure travel, executive assistance, travel analytics and duty of care."],
      regions: ["Regions", "We operate in 140+ countries from our Tunis head office, with regional operations experts in India, Dubai and Tunisia handling local requirements."],
      savings: ["Savings", "Negotiated rates with 500+ airlines and hotel chains, plus automated policy guardrails and spend analytics, help clients reduce travel spend by an average of 30%."],
      support: ["Support", "Traveller support is available 24/7 — including rebooking, disruption handling and emergency assistance wherever your people are."],
      events: ["Events", "Yes. We handle venue sourcing, contracting, on-site management and full logistics for corporate meetings and events."],
      other: ["Something else", "Happy to help. Share a few details on the contact page and our team replies within one business day."]
    };
    const { open, key } = this.state;
    return {
      open, panelDisplay: open ? "block" : "none",
      toggle: () => this.setState({ open: !open }),
      toggleLabel: open ? "Close" : "FAQ",
      answer: qa[key][1],
      questions: Object.keys(qa).filter(k => k !== "intro").map(k => ({
        label: qa[k][0],
        bg: key === k ? "#FFF3E9" : "#ffffff",
        color: key === k ? "#B84D00" : "#2B2724",
        border: key === k ? "#FFD9B8" : "#E6E0D8",
        pick: () => this.setState({ key: k })
      }))
    };
  }
}
</script>
</body>
</html>
