<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="background: {{ bg }}; padding: clamp(68px, 9vw, 130px) clamp(18px, 4vw, 44px); fontFamily: 'Figtree', system-ui, sans-serif;">
  <div style="maxWidth: 1280px; margin: 0 auto;">
    <div data-reveal="1" style="display: flex; flexWrap: wrap; alignItems: flex-end; justifyContent: space-between; gap: 18px 40px; marginBottom: clamp(32px, 4vw, 52px);">
      <div style="maxWidth: 620px;">
        <div style="fontSize: 11px; fontWeight: 700; letterSpacing: .14em; textTransform: uppercase; color: #B84D00;">Built for everyone who travels</div>
        <h2 style="margin: 18px 0 0; fontFamily: 'Libre Caslon Display', Georgia, serif; fontWeight: 400; fontSize: clamp(32px, 4.2vw, 56px); lineHeight: 1.07; letterSpacing: -0.02em; color: #111111; textWrap: balance;">One programme, four points of view</h2>
      </div>
      <p style="margin: 0; fontSize: 14px; color: #7C736B;">{{ hintText }}</p>
    </div>
    <div style="display: grid; gridTemplateColumns: repeat(auto-fit, minmax(250px, 1fr)); gap: clamp(14px, 1.8vw, 22px);" data-stagger="1">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
        <div data-reveal="1" style="perspective: 1400px; minWidth: 0;" onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}">
          <div style="position: relative; height: clamp(400px, 34vw, 460px); transformStyle: preserve-3d; transform: {{ c.rot }}; transition: transform .9s cubic-bezier(.2,.8,.2,1);">
            <button type="button" aria-label="{{ c.openLabel }}" aria-expanded="{{ c.flipped }}" onClick="{{ c.toggle }}" style="position: absolute; inset: 0; padding: 0; border: none; cursor: pointer; textAlign: left; borderRadius: 20px; overflow: hidden; background: #2A2724; backfaceVisibility: hidden; WebkitBackfaceVisibility: hidden; boxShadow: 0 24px 50px -24px rgba(17,17,17,.45); fontFamily: inherit;">
              <img src="{{ c.img }}" alt="{{ c.alt }}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; objectFit: cover; filter: saturate(.88);" />
              <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,0) 38%, rgba(17,17,17,.86) 100%);"></span>
              <span style="position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; alignItems: flex-end; justifyContent: space-between; gap: 12px; color: #ffffff;">
                <span>
                  <span style="display: block; fontSize: 11px; fontWeight: 700; letterSpacing: .14em; textTransform: uppercase; color: #FFD9B8;">{{ c.kicker }}</span>
                  <span style="display: block; marginTop: 6px; fontFamily: 'Libre Caslon Display', Georgia, serif; fontSize: 28px; lineHeight: 1.1;">{{ c.title }}</span>
                </span>
                <span aria-hidden="true" style="flexShrink: 0; width: 42px; height: 42px; display: grid; placeItems: center; borderRadius: 999px; background: #FF6B00; color: #fff;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"></path></svg>
                </span>
              </span>
            </button>
            <div style="position: absolute; inset: 0; borderRadius: 20px; background: #111111; color: #ffffff; padding: clamp(22px, 2.4vw, 28px); display: flex; flexDirection: column; transform: rotateY(180deg); backfaceVisibility: hidden; WebkitBackfaceVisibility: hidden; boxShadow: 0 24px 50px -24px rgba(17,17,17,.55); overflow: hidden;">
              <span aria-hidden="true" style="position: absolute; top: -90px; right: -90px; width: 220px; height: 220px; borderRadius: 999px; background: radial-gradient(circle, rgba(255,107,0,.4), rgba(255,107,0,0) 70%);"></span>
              <div style="position: relative; display: flex; alignItems: center; justifyContent: space-between; gap: 10px;">
                <span style="fontFamily: 'Libre Caslon Display', Georgia, serif; fontSize: 25px;">{{ c.title }}</span>
                <button type="button" aria-label="Flip card back" onClick="{{ c.toggle }}" style="width: 34px; height: 34px; display: grid; placeItems: center; borderRadius: 999px; border: 1px solid rgba(255,255,255,.22); background: transparent; color: #fff; cursor: pointer;">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <ul style="position: relative; listStyle: none; margin: 22px 0 0; padding: 0; display: flex; flexDirection: column; gap: 14px; flexGrow: 1;">
                <sc-for list="{{ c.points }}" as="pt" hint-placeholder-count="4">
                  <li style="display: flex; gap: 11px; fontSize: 14.6px; lineHeight: 1.5; color: rgba(255,255,255,.86);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF8A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flexShrink: 0; marginTop: 3px;" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    {{ pt }}
                  </li>
                </sc-for>
              </ul>
              <a href="{{ c.href }}" tabIndex="{{ c.tab }}" style="position: relative; display: inline-flex; alignItems: center; justifyContent: center; gap: 8px; background: #FF6B00; color: #ffffff; fontSize: 14.5px; fontWeight: 600; padding: 14px 20px; borderRadius: 999px; transition: background .18s;" style-hover="background: #E55F00; color: #ffffff;">{{ c.cta }} →</a>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffffff&quot;,&quot;options&quot;:[&quot;#ffffff&quot;,&quot;#FBF8F4&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { flipped: -1, fine: true };
  componentDidMount() {
    this.setState({ fine: !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches) });
  }
  renderVals() {
    const { flipped, fine } = this.state;
    const data = [
      { kicker: "For companies", title: "Finance & procurement", href: "/travel-management", cta: "Travel management",
        img: "https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=700&h=900&fit=crop", alt: "A light-filled open-plan office",
        points: ["Negotiated rates applied to every booking", "Policy and approvals built into the booking flow", "Spend, savings and compliance reporting", "One reconciled invoice for every channel"] },
      { kicker: "For assistants", title: "Executive assistants", href: "/corporate-travel", cta: "Corporate travel",
        img: "https://images.unsplash.com/photo-1563986768609-322da13575f3?w=700&h=900&fit=crop", alt: "Reviewing an itinerary on a laptop and phone",
        points: ["Traveller preferences held on every profile", "Late changes handled by a named team", "Visa checks and appointments booked for you", "WhatsApp support in Arabic, French or English"] },
      { kicker: "For travellers", title: "Frequent travellers", href: "/corporate-travel", cta: "How we support travellers",
        img: "assets/slider1-2000.jpg", alt: "A traveller in a departure lounge watching an aircraft take off",
        points: ["24/7 support when plans change", "Transfers timed to the flight, not the booking", "Rebooking during strikes and cancellations", "Personal trips arranged by the same team"] },
      { kicker: "For organisers", title: "Event planners", href: "/meetings-events", cta: "Meetings & events",
        img: "https://images.unsplash.com/photo-1505373877841-8d25f7d46678?w=700&h=900&fit=crop", alt: "An audience watching a presentation",
        points: ["Venue sourcing and contract negotiation", "Delegate travel and room blocks", "On-site event management", "A single invoice after the event"] }
    ];
    return {
      bg: this.props.bg ?? "#ffffff",
      hintText: fine ? "Hover a card to see what changes for that role." : "Tap a card to see what changes for that role.",
      cards: data.map((d, i) => ({
        ...d, flipped: flipped === i, tab: flipped === i ? 0 : -1,
        openLabel: d.title + " — show details",
        rot: flipped === i ? "rotateY(180deg)" : "rotateY(0deg)",
        enter: () => fine && this.setState({ flipped: i }),
        leave: () => fine && this.setState(s => (s.flipped === i ? { flipped: -1 } : null)),
        toggle: () => this.setState(s => ({ flipped: s.flipped === i ? -1 : i }))
      }))
    };
  }
}
</script>
</body>
</html>
